[platformio]
default_envs = gateway_router
src_dir = .

[env:gateway_router]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = 
    -<*>
    +<src/>
build_flags = 
    -D IS_GATEWAY
    -D CORE_DEBUG_LEVEL=3
    -I include
lib_deps =
    jgromes/RadioLib@^6.6.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    adafruit/RTClib@^2.1.1

[env:test_lora_gateway_rx]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = 
    -<*>
    +<standalone_test/test_lora_gateway_rx/>
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -I include
lib_deps = 
    jgromes/RadioLib@^6.6.0
