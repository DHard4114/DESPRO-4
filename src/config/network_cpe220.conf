# ==========================================================
# TP-LINK CPE220 OUTDOOR AP NETWORK CONFIGURATION
# Project: Smart-Sanitation eSOS (Blank Spot Deployment)
# ==========================================================

[DEVICE_INFO]
Model = TP-Link CPE220 V3
Operating_Mode = Access Point (AP)
Antenna = Built-in 12dBi Dual-polarized Directional
Transmit_Power = 23 dBm (200mW)

[WIRELESS_SETTINGS]
SSID = eSOS_Sanitation_Mesh_Net
Security_Mode = WPA2-PSK (AES)
Channel_Frequency = 2.412 GHz (Channel 1)
Channel_Width = 20 MHz (Optimized for interference rejection)
Distance_Setting = 1.5 km (Auto-adjust timing)
Isolation = Disabled (Permits gateway to local server routing)

[IP_SETTINGS]
IP_Assignment = Static
Management_IP = 192.168.0.254
Gateway_Server_IP = 192.168.0.100
Subnet_Mask = 255.255.255.0
DHCP_Server = Enabled
DHCP_Range_Start = 192.168.0.101
DHCP_Range_End = 192.168.0.200
Lease_Time = 7200

[FIREWALL_AND_PORTS]
HTTP_Dashboard_Port = 8000
WebSocket_Stream_Port = 8001
Gateway_LoRa_Receiver_Port = 9000
ICMP_Ping = Enabled
